<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="resumewesume">
  <!--
    A coral dot, and nothing else.

    It was the wordmark's capsule with a stroked `w` left in it, since RESUME
    and WESUME differ only in that letter. Sound as an idea, wrong at the size
    a favicon is seen: a 7 unit stroke on a 64 unit box is a hairline once it
    is quartered, and a three vertex zigzag inside a rounded square is more
    shapes than 16 pixels can hold. A filled circle has one edge, and the
    colour does the identifying, so nothing has to survive being four pixels
    across.

    NOTE, and it is the reason this file rendered as a broken image for its
    whole life: an XML comment may not contain a double hyphen. The comment
    that used to be here wrote its dashes the way every other comment in this
    codebase does, which made the document unparseable, so the browser threw
    away the whole icon. Punctuate with commas here. Nowhere else in the tree
    has this constraint, which is exactly why it went unnoticed.

    `width` and `height` alongside the viewBox for the same reason of not
    trusting a default: an intrinsic size is what a favicon is rasterised from.
  -->
  <circle cx="32" cy="32" r="32" fill="#FF5C39"/>
</svg>
