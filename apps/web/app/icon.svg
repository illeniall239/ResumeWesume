<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="resumewesume">
  <!--
    The sticker, compressed to one letter.

    RESUME and WESUME differ only in their first character, so that letter is
    the whole name reduced to the part that changes. The wordmark reverses
    `wesume` out of a coral capsule; this is that capsule with the one letter
    left in it, which is why the w wears the colour and not the R.

    Drawn rather than set in a webfont: a favicon is rendered before any font
    has loaded and in contexts that have none, so a glyph would fall back to
    whatever the system happens to hold. A stroked polyline is the letterform
    itself and looks the same everywhere -- and at 16px, which is the size this
    is actually seen at, a monoline w is more legible than a filled one.

    Radius is 18% of the side, as the wordmark's capsule reads at this aspect.
  -->
  <rect width="64" height="64" rx="11.5" fill="#FF5C39"/>
  <path
    fill="none"
    stroke="#FFFFFF"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M14 21 L22 44 L32 27 L42 44 L50 21"
  />
</svg>
